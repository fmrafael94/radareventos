<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Acompanhar pedido — Desvio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="midnight.css" />
  </head>
  <body class="tracking-page">
    <a class="skip-link" href="#submission-tracker">Saltar para o acompanhamento</a>
    <main class="tracking-shell">
      <a class="back-to-agenda" href="/">← Agenda</a>
      <p class="kicker">Pedidos ao Desvio</p>
      <h1>Acompanha a tua proposta.</h1>
      <p>Usa a referência de 12 caracteres e o mesmo e-mail indicado no envio. Não mostramos qualquer informação pessoal nesta página.</p>
      <form id="submission-tracker" class="tracking-form">
        <label>Referência<input name="reference" autocomplete="off" autocapitalize="characters" maxlength="12" placeholder="EX.: A1B2C3D4E5F6" required /></label>
        <label>E-mail<input name="email" type="email" autocomplete="email" placeholder="nome@exemplo.pt" required /></label>
        <button type="submit">Ver estado</button>
      </form>
      <section id="tracking-result" class="tracking-result" aria-live="polite" hidden></section>
    </main>
    <script src="submission-status.js"></script>
  </body>
</html>
