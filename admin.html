<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Revisão — Desvio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div><a class="admin-brand" href="index.html">Desvio</a><p>O teu radar de eventos · área privada</p></div>
        <button id="refresh" class="secondary" type="button">Atualizar</button>
      </header>
      <section class="admin-intro">
        <p class="eyebrow">Moderação</p>
        <h1>Pedidos para rever.</h1>
        <p>Centraliza sugestões de utilizadores e sinais encontrados pelas rondas automáticas. Nada entra na agenda sem confirmação humana e uma fonte oficial.</p>
      </section>
      <nav id="review-views" class="review-views" aria-label="Escolher tipo de revisão">
        <button type="button" data-view="community" aria-pressed="true">Utilizadores</button>
        <button type="button" data-view="automation" aria-pressed="false">Revisão automática</button>
      </nav>
      <nav id="status-filters" class="status-filters" aria-label="Filtrar pedidos de utilizadores">
        <button type="button" data-status="new" aria-pressed="true">Novos</button>
        <button type="button" data-status="reviewing" aria-pressed="false">Em análise</button>
        <button type="button" data-status="published" aria-pressed="false">Publicados</button>
        <button type="button" data-status="rejected" aria-pressed="false">Rejeitados</button>
        <button type="button" data-status="closed" aria-pressed="false">Fechados</button>
      </nav>
      <nav id="automation-status-filters" class="status-filters" aria-label="Filtrar revisão automática" hidden>
        <button type="button" data-status="new" aria-pressed="true">Por rever</button>
        <button type="button" data-status="reviewing" aria-pressed="false">Em análise</button>
        <button type="button" data-status="resolved" aria-pressed="false">Resolvidos</button>
        <button type="button" data-status="ignored" aria-pressed="false">Ignorados</button>
      </nav>
      <p id="admin-status" class="admin-status" role="status" aria-live="polite"></p>
      <section id="reports" class="reports" aria-live="polite"></section>
    </main>
    <template id="empty-state"><p class="empty-state">Não há pedidos neste estado.</p></template>
    <script src="admin.js"></script>
  </body>
</html>
