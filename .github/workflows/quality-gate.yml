name: Porta de qualidade

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar site, eventos e conteúdos sociais
        run: npm test
      - name: Guardar relatórios de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 14
