name: Verificação de links oficiais

on:
  workflow_dispatch:
  schedule:
    # Duas vezes por dia, fora da hora cheia. Isto reduz carga nas fontes
    # oficiais sem deixar a agenda ficar desatualizada durante dias.
    - cron: "17 5,17 * * *"

permissions:
  contents: read

concurrency:
  group: official-link-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirmar que não há eventos públicos sem cartaz
        run: |
          node scripts/audit-event-schema.mjs
          node scripts/audit-event-completeness.mjs
          node scripts/audit-event-date-evidence.mjs
      - name: Validar copies e formatos sociais
        run: |
          node scripts/audit-social-handles.mjs
          node scripts/audit-social-assets.mjs
          node scripts/audit-social-manifest.mjs
      - name: Verificar todas as páginas oficiais e bilheteiras diretas
        run: node scripts/audit-official-links.mjs --mode=two-hour
      - name: Enviar itens que precisam de revisão para o admin
        continue-on-error: true
        env:
          AUDIT_INGEST_URL: ${{ secrets.DESVIO_AUDIT_INGEST_URL }}
          AUDIT_INGEST_TOKEN: ${{ secrets.DESVIO_AUDIT_INGEST_TOKEN }}
        if: ${{ env.AUDIT_INGEST_URL != '' && env.AUDIT_INGEST_TOKEN != '' }}
        run: |
          {
            printf '%s' '{"kind":"link_audit","report":'
            cat reports/official-link-audit.json
            printf '%s' '}'
          } | curl --fail --silent --show-error --request POST "$AUDIT_INGEST_URL" \
            --header "Authorization: Bearer $AUDIT_INGEST_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @-
      - name: Guardar relatório de revisão
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: official-link-audit
          path: reports/official-link-audit.json
          retention-days: 14
