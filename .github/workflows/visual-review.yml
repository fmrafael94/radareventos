name: Revisão visual

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
      - name: Servir o site
        run: python3 -m http.server 4173 --bind 127.0.0.1 &
      - name: Capturar desktop, tablet e mobile
        run: |
          mkdir -p visual-review
          chrome --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,1200 --screenshot=visual-review/home-desktop.png http://127.0.0.1:4173/
          chrome --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=768,1200 --screenshot=visual-review/home-tablet.png http://127.0.0.1:4173/
          chrome --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=390,1200 --screenshot=visual-review/home-mobile.png http://127.0.0.1:4173/
          chrome --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=390,1200 --screenshot=visual-review/404-mobile.png http://127.0.0.1:4173/404.html
      - name: Guardar revisão visual
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: visual-review/*.png
          retention-days: 14
