<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#193427" />
    <title>Entrar — Desvio</title>
    <link rel="icon" type="image/png" href="https://odesvio.pt/brand/logo-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: light; font-family: "DM Sans", system-ui, sans-serif; background: #f5f5ee; color: #17241c; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 16% 12%, #dfe9cf 0, transparent 31rem), #f5f5ee; }
      main { width: min(100%, 430px); padding: clamp(28px, 7vw, 48px); border: 1px solid #cbd2c6; border-radius: 28px; background: rgba(255,255,250,.88); box-shadow: 0 24px 60px rgba(23,36,28,.12); }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 1.45rem; font-weight: 700; text-decoration: none; color: inherit; }
      .brand img { width: 36px; height: 36px; border-radius: 9px; }
      .eyebrow { margin: 52px 0 10px; color: #59714c; font: 500 .78rem/1 "DM Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 9vw, 3rem); line-height: .94; letter-spacing: -.075em; }
      p { color: #526058; line-height: 1.5; }
      form { margin-top: 28px; display: grid; gap: 12px; }
      label { font-weight: 700; font-size: .95rem; }
      input, button { width: 100%; min-height: 52px; border-radius: 12px; font: inherit; }
      input { margin-top: 8px; padding: 0 14px; border: 1px solid #aeb9ab; background: #fffef9; color: inherit; }
      input:focus { outline: 3px solid #bfd477; outline-offset: 2px; border-color: #55713d; }
      button { border: 0; background: #193f2d; color: #fff; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .65; cursor: wait; }
      #message { min-height: 1.5em; margin: 4px 0 0; color: #a0392b; font-size: .92rem; }
      footer { margin-top: 35px; font-size: .8rem; color: #6d796f; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="https://odesvio.pt/"><img src="https://odesvio.pt/brand/logo-icon.png" alt="" />Desvio</a>
      <p class="eyebrow">Área privada</p>
      <h1>Rever a agenda.</h1>
      <p>Entra com a password da administração para gerir pedidos e correções.</p>
      <form id="login-form">
        <label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required autofocus /></label>
        <button type="submit">Entrar</button>
        <p id="message" role="alert" aria-live="polite"></p>
      </form>
      <footer>O acesso é registado e limitado contra tentativas repetidas.</footer>
    </main>
    <script src="/admin-login.js"></script>
  </body>
</html>
